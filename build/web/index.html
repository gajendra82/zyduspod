<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zydus Vistaar is a platform for managing and tracking the status of your shipments.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zydus Vistaar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Zydus Vistaar</title>
  <link rel="manifest" href="manifest.json">
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  <!-- Permissions Policy for camera access -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*">
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /* Camera Modal Styles */
    #cameraModal {
      display: none;
      position: fixed;
      z-index: 999999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #cameraModal.active {
      display: flex;
    }

    #cameraContainer {
      position: relative;
      max-width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #videoElement {
      max-width: 100%;
      max-height: 70vh;
      border: 3px solid #00A0A8;
      border-radius: 12px;
      background: #000;
    }

    #cameraControls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .camera-btn {
      padding: 15px 35px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0. 3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .camera-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .camera-btn:active {
      transform: scale(0.98);
    }

    .camera-btn.capture {
      background-color: #00A0A8;
      color: white;
    }

    .camera-btn.cancel {
      background-color: #dc3545;
      color: white;
    }

    #cameraStatus {
      margin-top: 10px;
      color: white;
      font-size: 14px;
      text-align: center;
    }
  </style>
  
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x. png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x. png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <script id="camera-capture-script">
    let stream = null;
    let videoElement = null;
    let cameraModal = null;

    // Function to trigger real camera with video preview
    async function triggerCameraCapture() {
      try {
        // Create modal if it doesn't exist
        if (! document.getElementById('cameraModal')) {
          cameraModal = document.createElement('div');
          cameraModal.id = 'cameraModal';
          cameraModal.innerHTML = `
            <div id="cameraContainer">
              <video id="videoElement" autoplay playsinline></video>
              <div id="cameraStatus">Camera ready</div>
              <div id="cameraControls">
                <button class="camera-btn capture" onclick="capturePhoto()">
                  📷 Capture Photo
                </button>
                <button class="camera-btn cancel" onclick="closeCameraModal()">
                  ❌ Cancel
                </button>
              </div>
            </div>
          `;
          document.body.appendChild(cameraModal);
        } else {
          cameraModal = document.getElementById('cameraModal');
        }

        videoElement = document.getElementById('videoElement');
        const statusElement = document.getElementById('cameraStatus');

        // Show modal
        cameraModal.classList. add('active');
        statusElement.textContent = 'Requesting camera access...';

        // Request camera access with high quality settings
        try {
          stream = await navigator.mediaDevices. getUserMedia({
            video: {
              facingMode: 'environment', // Prefer back camera on mobile
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          });

          videoElement.srcObject = stream;
          statusElement.textContent = 'Camera ready - Click Capture Photo';
        } catch (cameraError) {
          console. error('Camera access error:', cameraError);
          statusElement.textContent = 'Camera access denied or unavailable';
          statusElement.style.color = '#dc3545';
          
          // Auto-close after 3 seconds
          setTimeout(() => {
            closeCameraModal();
            window.dispatchEvent(new CustomEvent('camera_capture_cancelled'));
          }, 3000);
        }
      } catch (error) {
        console.error('Camera modal error:', error);
        window.dispatchEvent(new CustomEvent('camera_capture_cancelled'));
      }
    }

    function closeCameraModal() {
      // Stop all camera streams
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      // Hide modal
      if (cameraModal) {
        cameraModal. classList.remove('active');
      }

      // Reset video element
      if (videoElement) {
        videoElement.srcObject = null;
      }

      // Notify Flutter
      window.dispatchEvent(new CustomEvent('camera_capture_cancelled'));
    }

    function capturePhoto() {
      if (!videoElement || !videoElement.srcObject) {
        alert('Camera not ready');
        return;
      }

      const statusElement = document.getElementById('cameraStatus');
      statusElement.textContent = 'Capturing... ';

      // Create canvas to capture the current video frame
      const canvas = document.createElement('canvas');
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement. videoHeight;

      const context = canvas.getContext('2d');
      context. drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      // Convert to blob and send to Flutter
      canvas.toBlob(function(blob) {
        if (blob) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const base64String = e.target.result.split(',')[1];
            
            // Send to Flutter
            window.dispatchEvent(new CustomEvent('camera_image_captured', {
              detail: {
                base64: base64String,
                filename: `camera_${Date.now()}.jpg`,
                type: 'image/jpeg'
              }
            }));

            closeCameraModal();
          };
          reader.readAsDataURL(blob);
        } else {
          alert('Failed to capture photo');
          statusElement.textContent = 'Capture failed - try again';
        }
      }, 'image/jpeg', 0.95);
    }

    // Function to trigger gallery picker
    function triggerGalleryPicker() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.multiple = true; // Allow multiple selection
      
      input.onchange = function(event) {
        const files = Array.from(event.target.files);
        if (files.length > 0) {
          let processedCount = 0;
          const images = [];
          
          files.forEach((file, index) => {
            const reader = new FileReader();
            reader. onload = function(e) {
              const base64String = e.target.result.split(',')[1];
              images.push({
                base64: base64String,
                filename: file.name,
                type: file.type,
                index: index
              });
              
              processedCount++;
              if (processedCount === files.length) {
                // All files processed, send to Flutter
                window.dispatchEvent(new CustomEvent('gallery_images_selected', {
                  detail: { images: images }
                }));
              }
            };
            reader.readAsDataURL(file);
          });
        } else {
          window.dispatchEvent(new CustomEvent('gallery_selection_cancelled'));
        }
      };
      
      input. click();
    }

    // Close camera modal when pressing Escape key
    document.addEventListener('keydown', function(e) {
      if (e. key === 'Escape' && cameraModal && cameraModal. classList.contains('active')) {
        closeCameraModal();
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
