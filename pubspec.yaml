name: zydus_vistaar
# Dart package identifier `zyduspod` is intentionally NOT renamed — every
# package:zyduspod/... import across the codebase depends on it. The
# user-visible app name "Zydus Vistaar" is set via android:label and
# iOS CFBundleDisplayName/CFBundleName.
description: "Zydus Vistaar — Zydus Healthcare KAM CRM Platform."
publish_to: "none"
version: 1.0.27+37
environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  mobile_scanner: ^7.0.1
  image_picker: ^1.0.7
  image: ^4.1.7
  http_parser: ^4.0.2
  shared_preferences: ^2.5.3
  open_filex: ^4.5.0
  pdf: ^3.10.8
  http: ^1.2.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  path: ^1.9.0

  printing: ^5.13.0
  zxing2: ^0.2.4 # upgrade from 0.2.4 so QRCodeReader is available
  file_picker: ^10.3.3

  # BLoC state management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  url_launcher: ^6.3.2
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.1

  # Firebase dependencies
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Local notifications
  flutter_local_notifications: ^17.2.3
  dio: ^5.9.0
  syncfusion_flutter_pdfviewer: ^31.1.19
  universal_html: ^2.3.0
  js: ^0.7.2
  pdfx: ^2.9.2
  google_mlkit_document_scanner: ^0.4.0
  flutter_doc_scanner: ^0.0.16

  # Sales Analytics Dashboard
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo_1.jpeg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/logo_1.jpeg
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/logo1.png
  android_12:
    image: assets/branding/logo1.png
    icon_background_color: "#FFFFFF"
